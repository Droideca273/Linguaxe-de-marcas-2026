<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Biblioteca</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h2>Brawl Stars: Origen de Gus</h2>
    <video autoplay="autoplay" controls="controls" poster="espera.png" width="640" height="340" loop="loop">
        <source src="BrawlStars.mp4" type="video/mp4" />
        <source src="BrawlStars.ogg" type="video/ogg" />
        <p>El navegador no puede mostrar el vídeo</p>
    </video>
    <h2>Audio</h2>
    <audio controls="controls" autoplay="autoplay" loop="loop">
        <source src="Brawl.mp3" type="audio/mp3" />
        <source src="Brawl.ogg" type="audio/ogg" />
        <p>El navegador no soporta este audio</p>
    </audio>
</body>
</html>
