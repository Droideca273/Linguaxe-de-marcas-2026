<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formularios</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <form action="validar.php" method="get">
        <fieldset>
            <legend>Para datos personales</legend>
            <label for="telefono">Telefono de contacto</label>
            <input type="text“ id="telefono" name="telefono" maxlength="9" size="8" placeholder="9 numeros" required pattern="[0-1]{9}"/><br/>
            <label for="correo">Correo electrónico</label>
            <input type="text“ id="correo" name="correo" maxlength="50" size="40" placeholder="El formato correcto es nombre+@+servidor de correo"/><br/>
        </fieldset>
    </form>
</body>
</html>
