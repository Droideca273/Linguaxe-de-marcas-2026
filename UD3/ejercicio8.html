<html>
<head>
<title>Ejercicio de pseudo-clases</title>
</head>
<style>
    li:last-child{
        color: green;
        font-size: 70px;
    }
    li:nth-child(even){
        color: red;
        font-size: 50px;
    }
    li:first-child{
        color: blue;
        font-size: 20px;
    }
    li:nth-child(3){
        color: orange;
        font-size: 30px;
    }
</style>
<body>
<ul>
<li>Primero</li>
<li>Segundo</li>
<li>Tercero</li>
<li>Cuarto</li>
<li>Quinto</li>
</ul>
</body>
</html>
